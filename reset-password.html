<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>비밀번호 재설정</title>

    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
      }

      .box {
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      input {
        padding: 10px;
      }

      button {
        padding: 10px;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h2>새 비밀번호 설정</h2>

      <input type="password" id="new-password" placeholder="새 비밀번호" />

      <button id="reset-btn">비밀번호 변경</button>
    </div>

    <script type="module" src="./reset-password.js"></script>
  </body>
</html>
